<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<meta name="description" content="Beeri English Coach – אפליקציית אנגלית אישית עם מאמן AI, חזרות חכמות ומסלול לימוד מדורג.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beeri English Coach ⚽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c6f24e'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
/* ============ theme ============ */
:root{
  --bg:#080e18; --bg2:#0c1523; --card:#111d2f; --card2:#16243a; --card3:#1b2c46;
  --line:#22344f; --line2:#2d4462; --tx:#f2f6fb; --mu:#93a4bb; --mu2:#6f8299;
  --lime:#c6f24e; --lime-d:#9ed62f; --cyan:#3ddcf5; --gold:#ffc94d; --pink:#ff7bb0;
  --purple:#b49bff; --red:#ff8080; --green:#4ade80; --orange:#ffa45c;
  --r:22px; --r2:15px; --r3:11px;
  --shadow:0 24px 55px -28px rgba(0,0,0,.9);
  --safe-b:env(safe-area-inset-bottom,0px);
  --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--tx); min-height:100vh; line-height:1.65;
  font-family:"Rubik","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:calc(16px * var(--fs)); padding-bottom:calc(24px + var(--safe-b));
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(900px 520px at 80% -10%,rgba(198,242,78,.10),transparent 65%),
    radial-gradient(800px 500px at 5% 0%,rgba(61,220,245,.09),transparent 60%),
    radial-gradient(700px 700px at 50% 110%,rgba(180,155,255,.08),transparent 60%),
    var(--bg);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.018) 118px 120px);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 75%);
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--cyan)}
::selection{background:rgba(198,242,78,.3)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
.en{direction:ltr;unicode-bidi:isolate;text-align:left;display:inline}
.ltr{direction:ltr;text-align:left}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--mu)}
.small{font-size:.85rem}
.tiny{font-size:.76rem}
.center{text-align:center}
.hide{display:none!important}
.spacer{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:60;padding:10px 14px;
  background:rgba(8,14,24,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(34,52,79,.7);
}
.topbar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;
  background:linear-gradient(140deg,var(--lime),#7ec21f);color:#0a1205;
  box-shadow:0 8px 22px -10px rgba(198,242,78,.8);flex:none;
}
.brand-txt{line-height:1.1;min-width:0}
.brand-txt b{font-size:1rem;letter-spacing:.2px;display:block;white-space:nowrap}
.brand-txt span{font-size:.68rem;color:var(--mu);letter-spacing:1.4px;text-transform:uppercase}
.hstats{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.hpill{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;
  background:rgba(22,36,58,.85);border:1px solid var(--line);font-weight:800;font-size:.8rem;white-space:nowrap;
}
.hpill b{color:var(--lime);font-weight:900}
.hpill.streak b{color:var(--gold)}
.hbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem;
  background:rgba(22,36,58,.85);border:1px solid var(--line);flex:none;transition:.15s;
}
.hbtn:hover{background:var(--card3);transform:translateY(-1px)}
@media(max-width:560px){
  .brand-txt span{display:none}
  .brand-txt b{font-size:.9rem}
  .hpill{padding:5px 8px;font-size:.74rem}
  .hbtn{width:34px;height:34px}
}

/* ============ layout ============ */
.main{max-width:1060px;margin:0 auto;padding:16px 14px 26px;min-height:60vh}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page{animation:fadeUp .3s ease both}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-title{font-size:1.32rem;font-weight:900;letter-spacing:-.2px}
.page-sub{color:var(--mu);font-size:.86rem;width:100%;margin-top:-4px}
.back{
  width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:1.1rem;flex:none;
}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-head h2{font-size:1.02rem;font-weight:900;letter-spacing:-.1px}
.section-head .more{margin-inline-start:auto;font-size:.8rem;color:var(--cyan);font-weight:700}
.card{
  background:linear-gradient(160deg,rgba(22,36,58,.92),rgba(17,29,47,.92));
  border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
}
.card.flat{box-shadow:none;background:rgba(17,29,47,.65)}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.grid.three,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.grid.two{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr}}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:rgba(61,220,245,.1);border:1px solid rgba(61,220,245,.25);color:var(--cyan);
  font-size:.71rem;font-weight:800;letter-spacing:.2px;white-space:nowrap;
}
.tag.lime{background:rgba(198,242,78,.1);border-color:rgba(198,242,78,.3);color:var(--lime)}
.tag.gold{background:rgba(255,201,77,.1);border-color:rgba(255,201,77,.28);color:var(--gold)}
.tag.pink{background:rgba(255,123,176,.1);border-color:rgba(255,123,176,.28);color:var(--pink)}
.tag.purple{background:rgba(180,155,255,.1);border-color:rgba(180,155,255,.28);color:var(--purple)}
.tag.red{background:rgba(255,128,128,.1);border-color:rgba(255,128,128,.28);color:var(--red)}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:13px;font-weight:800;font-size:.9rem;
  background:var(--card3);border:1px solid var(--line2);transition:.16s;min-height:42px;
}
.btn:hover{background:#25395a;transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--lime),var(--lime-d));border-color:transparent;color:#0b1404;box-shadow:0 10px 26px -14px rgba(198,242,78,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.cyan{background:linear-gradient(135deg,#2cc7e6,#1b9fc9);border-color:transparent;color:#03141a}
.btn.purple{background:linear-gradient(135deg,#b49bff,#8d6cf0);border-color:transparent;color:#120a2a}
.btn.ghost{background:transparent;border-color:var(--line2)}
.btn.ghost:hover{background:rgba(34,52,79,.6)}
.btn.soft{background:rgba(198,242,78,.1);border-color:rgba(198,242,78,.3);color:var(--lime)}
.btn.danger{background:rgba(255,128,128,.1);border-color:rgba(255,128,128,.3);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:.79rem;min-height:34px;border-radius:10px}
.btn.xs{padding:4px 8px;font-size:.72rem;min-height:28px;border-radius:8px}
.btn.wide{width:100%}
.btn.icon{padding:0;width:42px;height:42px;border-radius:13px;font-size:1.05rem}
.iconbtn{
  width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;
  background:rgba(61,220,245,.08);border:1px solid rgba(61,220,245,.18);font-size:.9rem;
}
.iconbtn:hover{background:rgba(61,220,245,.18)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:7px 12px;border-radius:99px;background:rgba(22,36,58,.9);border:1px solid var(--line);
  font-size:.8rem;font-weight:700;color:var(--mu);transition:.15s;
}
.chip:hover,.chip.active{background:rgba(198,242,78,.12);border-color:rgba(198,242,78,.4);color:var(--lime)}

/* ============ hero / dashboard ============ */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:20px;
  background:
    radial-gradient(600px 240px at 90% -30%,rgba(198,242,78,.22),transparent 70%),
    linear-gradient(135deg,#15253c,#0e1929 60%);
  border:1px solid var(--line2);box-shadow:var(--shadow);
}
.hero::after{
  content:"⚽";position:absolute;left:-14px;bottom:-34px;font-size:9rem;opacity:.045;transform:rotate(-18deg);pointer-events:none;
}
.hero-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font-size:1.45rem;line-height:1.25;font-weight:900;letter-spacing:-.4px}
.hero h1 span{color:var(--lime)}
.hero p{color:var(--mu);font-size:.88rem;margin-top:4px;max-width:46ch}
.hero-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ring-wrap{margin-inline-start:auto;display:flex;gap:12px;align-items:center}
.ring{
  --p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--lime) calc(var(--p)*1%),rgba(45,68,98,.65) 0);
  transition:background .6s;
}
.ring>div{
  width:72px;height:72px;border-radius:50%;background:#0f1b2c;display:grid;place-items:center;
  text-align:center;line-height:1.05;font-weight:900;font-size:1.1rem;
}
.ring>div small{display:block;font-size:.58rem;color:var(--mu);font-weight:700;margin-top:2px}
.mini-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.stat-chip{
  background:rgba(8,14,24,.45);border:1px solid var(--line);border-radius:12px;
  padding:7px 11px;font-size:.78rem;color:var(--mu);font-weight:700;
}
.stat-chip b{color:var(--tx);font-size:.95rem;margin-inline-end:3px}
@media(max-width:620px){
  .hero{padding:16px}.hero h1{font-size:1.2rem}
  .ring-wrap{margin-inline-start:0;width:100%;justify-content:space-between;margin-top:4px;gap:10px}
  .ring{width:88px;height:88px}.ring>div{width:70px;height:70px;font-size:1.05rem}
  .ring>div small{font-size:.53rem;letter-spacing:-.2px}
  .hero .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .hero .mini-stats .stat-chip{text-align:center}
  .hero .hero-actions .btn{flex:1;min-width:130px}
}

/* task list */
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed rgba(45,68,98,.7)}
.task:last-child{border-bottom:0}
.task-dot{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--card3);border:1px solid var(--line2);font-size:.8rem;color:var(--mu);
}
.task.done .task-dot{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4);color:var(--green)}
.task.done .task-t{text-decoration:line-through;color:var(--mu)}
.task-t{font-size:.88rem;font-weight:700}
.task-s{font-size:.74rem;color:var(--mu2)}
.task .btn{margin-inline-start:auto;flex:none}

/* continue card */
.continue{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;
  background:linear-gradient(120deg,rgba(61,220,245,.1),rgba(198,242,78,.06));
  border:1px solid rgba(61,220,245,.25);width:100%;text-align:start;
}
.continue:hover{background:linear-gradient(120deg,rgba(61,220,245,.16),rgba(198,242,78,.09))}
.continue .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:rgba(8,14,24,.5);flex:none}
.continue b{display:block;font-size:.94rem}
.continue span{font-size:.78rem;color:var(--mu)}
.continue .arr{margin-inline-start:auto;color:var(--cyan);font-size:1.2rem}

/* word of day */
.wotd{position:relative;overflow:hidden}
.wotd .en{font-size:1.5rem;font-weight:900;color:var(--lime);letter-spacing:.5px}
.wotd .he{font-size:1rem;font-weight:700}
.wotd .ex{color:var(--mu);font-size:.86rem;margin-top:6px;border-inline-start:3px solid var(--line2);padding-inline-start:9px}
.fact{
  border-inline-start:3px solid var(--gold);background:rgba(255,201,77,.055);
  border-radius:0 14px 14px 0;padding:12px 14px;font-size:.86rem;color:#e9eef7;
}
.fact b{color:var(--gold)}

/* ============ units ============ */
.route{
  display:flex;gap:0;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none;
}
.route::-webkit-scrollbar{display:none}
.route-step{display:flex;align-items:center;flex:none}
.route-dot{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;
  background:var(--card2);border:1px solid var(--line2);color:var(--mu);font-weight:900;
}
.route-dot.done{background:rgba(198,242,78,.16);border-color:rgba(198,242,78,.5);color:var(--lime)}
.route-dot.cur{background:var(--lime);border-color:var(--lime);color:#0b1404;box-shadow:0 0 0 5px rgba(198,242,78,.12)}
.route-line{width:22px;height:2px;background:var(--line2)}
@media(min-width:860px){.route-line{width:48px}}

.unit-card{
  display:flex;gap:14px;align-items:flex-start;padding:15px;border-radius:var(--r);
  background:linear-gradient(160deg,rgba(22,36,58,.9),rgba(17,29,47,.9));
  border:1px solid var(--line);text-align:start;width:100%;transition:.18s;position:relative;overflow:hidden;
}
.unit-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.unit-card.done{border-color:rgba(198,242,78,.35)}
.unit-ic{
  width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;flex:none;
  background:rgba(8,14,24,.45);border:1px solid var(--line);
}
.unit-body{flex:1;min-width:0}
.unit-kicker{font-size:.7rem;color:var(--mu2);font-weight:800;letter-spacing:.6px}
.unit-title{font-size:1rem;font-weight:900;margin-top:1px}
.unit-title .en{font-size:.88rem;color:var(--mu);font-weight:700}
.unit-desc{font-size:.8rem;color:var(--mu);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.unit-foot{display:flex;align-items:center;gap:8px;margin-top:9px}
.bar{height:7px;border-radius:99px;background:rgba(45,68,98,.7);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .5s}
.unit-pct{font-size:.72rem;color:var(--mu);font-weight:800;white-space:nowrap}
.unit-go{margin-inline-start:auto;font-size:1.1rem;color:var(--mu)}

/* ============ unit page tabs ============ */
.unit-hero{border-radius:24px;padding:18px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(22,36,58,.95),rgba(12,21,35,.95));position:relative;overflow:hidden}
.unit-hero .big{font-size:2rem}
.unit-hero h1{font-size:1.3rem;font-weight:900;margin-top:2px}
.unit-hero .en-title{color:var(--mu);font-size:.92rem}
.seg{display:flex;gap:4px;padding:4px;background:rgba(12,21,35,.8);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none;margin:14px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;padding:8px 10px;border-radius:10px;font-size:.82rem;font-weight:800;color:var(--mu);white-space:nowrap;
}
.seg button.active{background:var(--card3);color:var(--tx);box-shadow:0 2px 10px -4px #000}

/* ============ rules / explanations ============ */
.rule{
  border:1px solid var(--line);border-radius:var(--r2);background:rgba(17,29,47,.75);
  margin-bottom:10px;overflow:hidden;transition:.2s;
}
.rule[open]{border-color:rgba(61,220,245,.35);background:rgba(22,36,58,.9)}
.rule summary{
  list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:.9rem;
}
.rule summary::-webkit-details-marker{display:none}
.rule summary .n{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(61,220,245,.12);color:var(--cyan);font-size:.76rem;font-weight:900;
}
.rule summary .chev{margin-inline-start:auto;color:var(--mu);transition:.2s;font-size:.8rem}
.rule[open] summary .chev{transform:rotate(180deg)}
.rule-body{padding:0 14px 14px;font-size:.87rem;color:#dbe4f0}
.rule-body p{margin-bottom:8px}
.rule-body b{color:#fff}
.formula{
  direction:ltr;text-align:left;font-family:"Consolas",monospace;font-size:.86rem;
  background:#0a1321;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  color:var(--lime);margin:8px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.5;
}
.ex-list{list-style:none;margin:8px 0}
.ex-list li{padding:6px 0;border-bottom:1px dashed rgba(45,68,98,.5);font-size:.85rem}
.ex-list li:last-child{border:0}
.ex-list .he{display:block;color:var(--mu2);font-size:.76rem;direction:rtl;text-align:right}
.mistake{
  background:rgba(255,128,128,.07);border:1px solid rgba(255,128,128,.22);border-radius:10px;
  padding:9px 11px;margin-top:8px;font-size:.82rem;
}
.mistake b{color:var(--red)}
.hook{
  background:rgba(198,242,78,.07);border:1px solid rgba(198,242,78,.2);border-radius:10px;
  padding:9px 11px;margin-top:8px;font-size:.82rem;
}
.hook b{color:var(--lime)}
.pron{color:var(--cyan);font-size:.78rem;font-weight:700}

/* ============ words ============ */
.word{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid rgba(45,68,98,.55);
}
.word:last-child{border:0}
.word-main{flex:1;min-width:0}
.word-en{font-weight:900;font-size:1rem;color:var(--tx);letter-spacing:.2px}
.word-he{font-size:.8rem;color:var(--mu);margin-inline-start:7px}
.word-ex{font-size:.78rem;color:var(--mu2);margin-top:2px}
.word-ex .he{color:var(--mu2);font-size:.72rem;display:block;direction:rtl;text-align:right}
.mastery{display:flex;gap:3px;flex:none;margin-top:5px}
.mastery i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.mastery i.on{background:var(--lime)}
.mastery i.mid{background:var(--gold)}

/* ============ exercise ============ */
.ex-shell{max-width:760px;margin:0 auto}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ex-progress{height:6px;background:rgba(45,68,98,.7);border-radius:99px;overflow:hidden;margin-bottom:16px}
.ex-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:99px;transition:width .4s}
.ex-card{
  background:linear-gradient(165deg,rgba(22,36,58,.96),rgba(15,27,44,.96));
  border:1px solid var(--line2);border-radius:24px;padding:18px;box-shadow:var(--shadow);
}
.ex-num{font-size:.72rem;color:var(--mu);font-weight:800;letter-spacing:.5px}
.ex-q{font-size:1.02rem;font-weight:700;line-height:1.7;margin:8px 0 14px}
.ex-q b{color:var(--lime)}
.ex-sentence{
  direction:ltr;text-align:left;font-size:1.05rem;line-height:1.9;background:#0a1321;border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin:10px 0;font-weight:600;
}
.blank{color:var(--lime);font-weight:900;letter-spacing:2px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{
  display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;text-align:start;
  background:rgba(12,21,35,.7);border:1px solid var(--line);font-size:.9rem;transition:.15s;width:100%;
}
.opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(61,220,245,.06)}
.opt .k{
  width:22px;height:22px;border-radius:6px;background:var(--card3);display:grid;place-items:center;
  font-size:.68rem;font-weight:900;color:var(--mu);flex:none;
}
.opt.correct{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.1)}
.opt.correct .k{background:var(--green);color:#052012}
.opt.wrong{border-color:rgba(255,128,128,.6);background:rgba(255,128,128,.09)}
.opt.wrong .k{background:var(--red);color:#2a0808}
.opt.dim{opacity:.55}
.opt .en{font-size:.95rem}
.input-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.txt{
  width:100%;padding:12px 14px;border-radius:12px;background:#0a1321;border:1px solid var(--line2);
  color:var(--tx);font-size:1rem;outline:none;direction:ltr;text-align:left;
}
.txt:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(61,220,245,.12)}
.txt.he{direction:rtl;text-align:right}
.txt::placeholder{color:var(--mu2);opacity:.7}
.scr-zone{
  min-height:56px;border:1px dashed var(--line2);border-radius:12px;padding:9px;display:flex;
  flex-wrap:wrap;gap:6px;align-content:flex-start;direction:ltr;margin-bottom:8px;background:rgba(10,19,33,.5);
}
.tok{
  padding:7px 11px;border-radius:9px;background:var(--card3);border:1px solid var(--line2);
  font-size:.9rem;font-weight:700;direction:ltr;transition:.15s;
}
.tok:hover{border-color:var(--cyan)}
.tok.used{opacity:.25;pointer-events:none}
.tok.in-zone{background:rgba(61,220,245,.14);border-color:rgba(61,220,245,.4)}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;font-size:.87rem;animation:fadeUp .25s ease both;scroll-margin-bottom:110px}
.fb.ok{background:rgba(74,222,128,.09);border:1px solid rgba(74,222,128,.32)}
.fb.no{background:rgba(255,128,128,.08);border:1px solid rgba(255,128,128,.3)}
.fb.info{background:rgba(61,220,245,.07);border:1px solid rgba(61,220,245,.22)}
.fb.gold{background:rgba(255,201,77,.07);border:1px solid rgba(255,201,77,.25)}
.fb h4{font-size:.95rem;margin-bottom:4px}
.fb .why{color:#d5dfec;margin-top:5px;line-height:1.7}
.fb .rule-link{font-size:.78rem;color:var(--cyan);font-weight:800;margin-top:6px;display:inline-block}
.fb .answer-line{direction:ltr;text-align:left;background:rgba(8,14,24,.5);padding:7px 10px;border-radius:8px;margin:6px 0;font-weight:700}
.ex-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.ex-actions .btn.primary{margin-inline-start:auto}
.hintbox{
  background:rgba(255,201,77,.06);border:1px solid rgba(255,201,77,.22);border-radius:10px;
  padding:9px 11px;font-size:.82rem;margin-top:10px;
}
.listen-big{
  display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:14px;
  background:rgba(61,220,245,.1);border:1px solid rgba(61,220,245,.3);color:var(--cyan);
  font-weight:800;font-size:.92rem;margin:4px 0 8px;
}
.listen-big:hover{background:rgba(61,220,245,.18)}
.ex-map{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ex-map button{
  width:32px;height:32px;border-radius:9px;font-size:.72rem;font-weight:800;
  background:var(--card2);border:1px solid var(--line);color:var(--mu);
}
.ex-map button.done{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.35);color:var(--green)}
.ex-map button.cur{outline:2px solid var(--lime);outline-offset:1px;color:var(--lime)}
.ex-map button.wrong{border-color:rgba(255,201,77,.6);color:var(--gold)}
.empty{text-align:center;padding:26px 12px;color:var(--mu);font-size:.88rem}
.empty .big{font-size:2rem;display:block;margin-bottom:6px;opacity:.8}

/* ============ review ============ */
.rings-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.spiral{position:relative;width:150px;height:150px;flex:none}
.spiral svg{width:100%;height:100%;transform:rotate(-90deg)}
.spiral .core{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1;
}
.spiral .core b{font-size:1.5rem;color:var(--lime)}
.spiral .core span{font-size:.63rem;color:var(--mu);display:block}
.legend{display:grid;gap:7px;flex:1;min-width:190px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:.83rem}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend-row b{margin-inline-start:auto}
.due-big{font-size:2.4rem;font-weight:900;color:var(--lime);line-height:1}
.due-label{font-size:.78rem;color:var(--mu);font-weight:700}
.upcoming{display:flex;flex-direction:column;gap:0}
.up-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(45,68,98,.5);font-size:.84rem}
.up-row:last-child{border:0}
.up-row .en{font-weight:800}
.up-row .when{margin-inline-start:auto;font-size:.72rem;color:var(--mu2);white-space:nowrap}

/* ============ chat ============ */
.chat-shell{
  display:flex;flex-direction:column;height:calc(100dvh - 138px);min-height:420px;
  background:rgba(10,19,33,.65);border:1px solid var(--line);border-radius:22px;overflow:hidden;
}
.chat-head{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);
  background:rgba(22,36,58,.75);flex:none;flex-wrap:wrap;
}
.avatar{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;flex:none;
  background:linear-gradient(140deg,rgba(198,242,78,.2),rgba(61,220,245,.14));border:1px solid var(--line2);
}
.chat-head .who b{display:block;font-size:.9rem;line-height:1.2}
.chat-head .who span{font-size:.72rem;color:var(--mu)}
.chat-head .tools{margin-inline-start:auto;display:flex;gap:5px;flex-wrap:wrap}
.chat-head .tools .iconbtn{width:32px;height:32px}
.msgs{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  overscroll-behavior:contain;
}
.msg{display:flex;flex-direction:column;max-width:88%;animation:fadeUp .25s ease both}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{
  padding:10px 14px;border-radius:16px;font-size:.9rem;line-height:1.65;position:relative;
}
.msg.ai .bubble{background:var(--card2);border:1px solid var(--line);border-start-start-radius:5px}
.msg.me .bubble{background:linear-gradient(135deg,#2b6f8f,#22506b);border:1px solid #357a99;border-start-end-radius:5px;color:#f4fbff}
.bubble .en{display:block;font-size:.95rem;line-height:1.7}
.bubble .he-tr{
  display:none;margin-top:7px;padding-top:7px;border-top:1px dashed rgba(147,164,187,.28);
  color:var(--mu);font-size:.8rem;line-height:1.6;
}
.msg.show-tr .bubble .he-tr{display:block}
.bubble-actions{display:flex;gap:4px;margin-top:4px;opacity:.75}
.bubble-actions .iconbtn{width:27px;height:27px;font-size:.75rem;border-radius:8px}
.corr{
  background:rgba(255,201,77,.07);border:1px solid rgba(255,201,77,.25);border-radius:12px;
  padding:9px 11px;margin-top:6px;font-size:.8rem;max-width:100%;
}
.corr b{color:var(--gold)}
.corr .fix{direction:ltr;text-align:left;margin:3px 0;font-size:.83rem}
.corr .fix s{color:#ff9b9b;opacity:.8}
.corr .fix em{color:var(--green);font-style:normal;font-weight:800}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.suggest button{
  text-align:start;padding:6px 10px;border-radius:10px;background:rgba(198,242,78,.08);
  border:1px solid rgba(198,242,78,.25);font-size:.78rem;color:#e7f7c8;direction:ltr;
}
.suggest button:hover{background:rgba(198,242,78,.16)}
.typing{display:inline-flex;gap:3px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{
  border-top:1px solid var(--line);padding:9px 11px calc(9px + var(--safe-b));background:rgba(15,27,44,.96);flex:none;
}
.composer-tools{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.mini-chip{
  padding:4px 9px;border-radius:8px;background:rgba(22,36,58,.9);border:1px solid var(--line);
  font-size:.72rem;color:var(--mu);font-weight:700;
}
.mini-chip:hover{color:var(--lime);border-color:rgba(198,242,78,.35)}
.composer-row{display:flex;gap:7px;align-items:flex-end}
.composer textarea{
  flex:1;resize:none;min-height:44px;max-height:120px;padding:11px 13px;border-radius:14px;
  background:#0a1321;border:1px solid var(--line2);font-size:.92rem;line-height:1.5;outline:none;
  direction:ltr;text-align:left;
}
.composer textarea:focus{border-color:var(--cyan)}
.mic-btn{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.1rem;flex:none;
  background:rgba(61,220,245,.1);border:1px solid rgba(61,220,245,.3);
}
.mic-btn.rec{background:rgba(255,128,128,.18);border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,128,128,.35)}50%{box-shadow:0 0 0 9px rgba(255,128,128,0)}}
.send-btn{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.15rem;flex:none;
  background:linear-gradient(135deg,var(--lime),var(--lime-d));color:#0b1404;font-weight:900;
}
.send-btn:disabled{opacity:.4}
.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.scenario-grid{grid-template-columns:1fr}}
.scenario{
  text-align:start;padding:14px;border-radius:16px;border:1px solid var(--line);
  background:rgba(17,29,47,.8);transition:.16s;position:relative;overflow:hidden;
}
.scenario:hover{border-color:rgba(198,242,78,.45);transform:translateY(-2px)}
.scenario .ic{font-size:1.5rem}
.scenario b{display:block;font-size:.92rem;margin-top:4px}
.scenario p{font-size:.76rem;color:var(--mu);margin-top:3px;line-height:1.5}
.scenario .meta{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.scenario .start{margin-top:9px;font-size:.75rem;color:var(--lime);font-weight:800}
.chat-note{font-size:.75rem;color:var(--mu2);padding:7px 11px;background:rgba(255,201,77,.05);border-bottom:1px solid rgba(255,201,77,.14)}
.chat-note b{color:var(--gold)}
.chat-summary{max-width:760px;margin:0 auto}

/* ============ stats ============ */
.stat-big{font-size:1.6rem;font-weight:900;line-height:1.1}
.stat-big small{font-size:.72rem;color:var(--mu);font-weight:700}
.skill-row{margin-bottom:11px}
.skill-top{display:flex;align-items:center;gap:8px;font-size:.83rem;margin-bottom:4px}
.skill-top b{margin-inline-start:auto;font-size:.78rem;color:var(--mu)}
.week-chart{display:flex;align-items:flex-end;gap:7px;height:110px;padding-top:8px}
.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week-bar i{
  width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--lime),rgba(198,242,78,.25));
  min-height:3px;transition:height .5s;
}
.week-bar.today i{background:linear-gradient(180deg,var(--cyan),rgba(61,220,245,.25))}
.week-bar span{font-size:.62rem;color:var(--mu2)}
.week-bar b{font-size:.66rem;color:var(--mu)}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:560px){.badge-grid{grid-template-columns:repeat(2,1fr)}}
.badge{
  padding:11px 8px;border-radius:14px;text-align:center;background:rgba(17,29,47,.75);
  border:1px solid var(--line);opacity:.45;filter:grayscale(1);
}
.badge.on{opacity:1;filter:none;border-color:rgba(198,242,78,.3);background:rgba(198,242,78,.05)}
.badge .ic{font-size:1.35rem;display:block}
.badge b{font-size:.72rem;display:block;margin-top:3px}
.badge span{font-size:.62rem;color:var(--mu2)}

/* ============ modals / toast ============ */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(4,8,14,.74);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeUp .18s ease both;
}
.overlay[hidden]{display:none}
.modal{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:linear-gradient(165deg,#16243a,#0e1929);
  border:1px solid var(--line2);border-radius:24px;padding:20px;box-shadow:0 30px 80px -20px #000;position:relative;
}
.modal h3{font-size:1.1rem;font-weight:900;margin-bottom:6px}
.modal .x{
  position:absolute;top:12px;inset-inline-end:12px;width:32px;height:32px;border-radius:10px;
  background:var(--card3);display:grid;place-items:center;
}
.field{margin-top:12px}
.field label{display:block;font-size:.8rem;font-weight:800;margin-bottom:5px;color:#dbe4f0}
.field .help{font-size:.72rem;color:var(--mu2);margin-top:4px;line-height:1.55}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:11px;background:#0a1321;border:1px solid var(--line2);
  color:var(--tx);outline:none;font-size:.9rem;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}
.field input.ltr,.field textarea.ltr{direction:ltr;text-align:left}
.radio-row{display:flex;flex-direction:column;gap:7px}
.radio-opt{
  display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:11px;border:1px solid var(--line);
  background:rgba(10,19,33,.5);cursor:pointer;font-size:.83rem;
}
.radio-opt:has(input:checked){border-color:rgba(198,242,78,.45);background:rgba(198,242,78,.05)}
.radio-opt input{margin-top:3px;accent-color:var(--lime)}
.radio-opt b{display:block;font-size:.85rem}
.radio-opt span{color:var(--mu);font-size:.74rem}
.status{font-size:.8rem;margin-top:8px;padding:8px 10px;border-radius:9px}
.status.ok{background:rgba(74,222,128,.1);color:#b6f7cb;border:1px solid rgba(74,222,128,.3)}
.status.bad{background:rgba(255,128,128,.1);color:#ffc4c4;border:1px solid rgba(255,128,128,.3)}
#toast{
  position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translate(-50%,20px);
  z-index:200;background:#e9f7c8;color:#132004;padding:9px 17px;border-radius:99px;font-weight:800;
  font-size:.82rem;box-shadow:0 15px 35px -12px #000;opacity:0;pointer-events:none;transition:.28s;max-width:90vw;
  text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-20px;font-size:1.2rem;z-index:300;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(320deg);opacity:.1}}
.xpfloat{
  position:fixed;z-index:210;font-weight:900;color:var(--lime);font-size:1rem;pointer-events:none;
  animation:xpup 1s ease-out forwards;text-shadow:0 2px 12px #000;
}
@keyframes xpup{from{opacity:0;transform:translateY(10px) scale(.8)}30%{opacity:1}to{opacity:0;transform:translateY(-45px) scale(1.1)}}

/* ============ professional side navigation ============ */
.menu-toggle{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;
  background:rgba(22,36,58,.85);border:1px solid var(--line);flex:none;transition:.15s;color:var(--tx);
}
.menu-toggle:hover{background:var(--card3);border-color:var(--cyan)}
.sidenav-backdrop{
  position:fixed;inset:0;z-index:85;background:rgba(4,8,14,.68);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.sidenav-backdrop.open{opacity:1;pointer-events:auto}
.sidenav{
  position:fixed;top:0;right:0;bottom:0;width:270px;z-index:90;
  background:linear-gradient(180deg,rgba(12,21,35,.98),rgba(8,14,24,.99));
  backdrop-filter:blur(22px);border-left:1px solid var(--line2);
  display:flex;flex-direction:column;padding:18px 14px calc(18px + var(--safe-b));
  box-shadow:-18px 0 48px -15px rgba(0,0,0,.85);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
}
.sidenav.open{transform:translateX(0)}
.sidenav-head{
  display:flex;align-items:center;gap:10px;padding:6px 6px 16px;
  border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sidenav-close{
  margin-inline-start:auto;width:32px;height:32px;border-radius:10px;
  background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;
  font-size:.95rem;color:var(--mu);transition:.15s;
}
.sidenav-close:hover{color:var(--tx);background:var(--card3)}
.sidenav-label{
  font-size:.68rem;font-weight:800;color:var(--mu2);letter-spacing:1px;
  text-transform:uppercase;padding:0 10px;margin-bottom:6px;
}
.sidenav-in{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
  color:var(--mu);font-size:.92rem;font-weight:800;transition:.16s;position:relative;
  text-align:right;width:100%;border:1px solid transparent;
}
.navbtn .ic{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(22,36,58,.75);border:1px solid var(--line);
  font-size:1.1rem;line-height:1;filter:grayscale(.3);opacity:.88;transition:.16s;flex:none;
}
.navbtn:hover{color:var(--tx);background:rgba(27,44,70,.6);border-color:rgba(45,68,98,.6)}
.navbtn.active{
  color:var(--lime);background:linear-gradient(90deg,transparent,rgba(198,242,78,.14));
  border-color:rgba(61,220,245,.22);box-shadow:inset -3px 0 0 var(--lime);
}
.navbtn.active .ic{
  filter:none;opacity:1;background:rgba(198,242,78,.14);border-color:var(--lime);
}
.navbtn .dot{
  margin-inline-start:auto;width:8px;height:8px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 3px rgba(255,128,128,.2);
}
.sidenav-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.sidenav-foot-btn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
  background:rgba(22,36,58,.6);border:1px solid var(--line);font-size:.82rem;
  font-weight:700;color:var(--mu);transition:.15s;width:100%;
}
.sidenav-foot-btn:hover{color:var(--tx);background:var(--card3)}
@media(min-width:1024px){
  body{padding-right:260px}
  .sidenav{transform:translateX(0);width:260px;box-shadow:none;z-index:65}
  .sidenav-backdrop,.menu-toggle,.sidenav-close{display:none!important}
  .topbar-in,.main{max-width:960px}
}

/* ============ exam ============ */
.exam-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{
  padding:6px 12px;border-radius:99px;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.3);
  color:var(--gold);font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums;
}

  e.style.top = Math.max(70, Math.min(r.top, innerHeight-80))+'px';
  document.body.appendChild(e); setTimeout(()=>e.remove(),1000);
}
function toast(t){
  const el=$('#toast'); if(!el) return;
  el.textContent=t; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600);
}
function confetti(n=26){
  const ems=['🎉','⭐','✨','🌟','🎊','💫','⚡'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='conf'; s.textContent=rnd(ems);
    s.style.left=Math.random()*100+'vw'; s.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),2800);
  }
}

/* ================= audio ================= */
let VOICE=null, AC=null;
function initVoice(){
  if(!('speechSynthesis' in window)) return;
  const pick=()=>{ const v=speechSynthesis.getVoices(); VOICE=v.find(x=>/^en[-_]US/i.test(x.lang)&&/Google|Natural|Samantha|Aria|Jenny/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; };
  pick(); speechSynthesis.onvoiceschanged=pick;
}
function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast('הדפדפן לא תומך בהשמעה'); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]*>/g,''));
    u.lang='en-US'; u.rate=rate || S.settings.ttsRate || .9;
    if(VOICE) u.voice=VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
function beep(ok){
  if(S.settings && !S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = ok ? [[660,0],[880,.11]] : [[210,0]];
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.frequency.value=f; o.type=ok?'sine':'triangle'; g.gain.value=.06;
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+d); o.stop(AC.currentTime+d+.16);
    });
  }catch(e){}
}
function listenOnce(lang,onRes,onErr,onEnd){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){ onErr&&onErr('unsupported'); return null; }
  const r=new R(); r.lang=lang; r.interimResults=false; r.maxAlternatives=5;
  let done=false;
  r.onresult=ev=>{ done=true; const alts=[...ev.results[0]].map(x=>x.transcript); onRes&&onRes(alts); };
  r.onerror=e=>{ if(!done){ done=true; onErr&&onErr(e.error||'error'); } };
  r.onend=()=>{ onEnd&&onEnd(); };
  try{ r.start(); }catch(e){ onErr&&onErr('start'); return null; }
  return r;
}
function applyFontScale(){
  const f=(S.settings&&S.settings.fontScale)||1;
  document.documentElement.style.setProperty('--fs', f);
}
function speakBtn(text,label){
  return `<button class="iconbtn" data-say="${escA(text)}" aria-label="השמעת ${escA(label||text)}" title="השמעה">🔊</button>`;
}

/* ================= build all exercises ================= */
function buildData(){
  UNITS.forEach(u=>{
    u.rules.forEach(r=>{ RULE_MAP[r.id] = {...r, unitId:u.id, unitTitle:u.title}; });
    u.words.forEach(w=>{
      const key=w.en.toLowerCase();
      if(!ALL_WORDS[key]){ ALL_WORDS[key]={...w, key}; ALL_WORD_LIST.push(ALL_WORDS[key]); }
    });
    const vocab = buildVocabExercises(u);
    u.exercises = [...vocab, ...u.grammar.map(g=>({...g, unit:u.id, skill:g.skill||'grammar'}))];
    u.exercises.forEach(e=>{ e.unit=u.id; EX_MAP[e.id]=e; });
  });
}
function buildVocabExercises(u){
  const exs=[];
  const hePool = [...new Set(u.words.map(w=>w.he))];
  const allHe = [...new Set(ALL_WORD_LIST.map(w=>w.he))];
  const distractors = (correct, n) => {
    const pool = shuffle([...new Set([...hePool, ...allHe])].filter(h=>h!==correct));
    return pool.slice(0,n);
  };
  u.words.forEach((w,idx)=>{
    exs.push({
      t:'mcq', id:`${u.id}.m.${w.en}`, unit:u.id, skill:'vocab', word:w.en, rule:'',
      q:`מה המשמעות של <b class="en">${w.en}</b>?`,
      opts:shuffle([w.he,...distractors(w.he,3)]), ans:w.he,
      why:`<b class="en">${w.en}</b> = ${w.he}. דוגמה: ${w.ex} — ${w.exHe}`,
      hint:`המילה מופיעה בתחילת הדוגמה: ${w.ex}`
    });
  });
  u.words.filter(w=>w.en.replace(/[^a-z]/gi,'').length>=5).slice(0,4).forEach(w=>{
    exs.push({
      t:'type', id:`${u.id}.t.${w.en}`, unit:u.id, skill:'vocab', word:w.en, rule:'',
      q:`איך כותבים באנגלית: <b>${w.he}</b>?`,
      ans:[w.en], why:`<b class="en">${w.en}</b> = ${w.he}. ${w.ex} — ${w.exHe}`,
      hint:`${w.en.length} אותיות, מתחילה ב-${w.en[0].toUpperCase()}.${w.pron?` הגייה: ${w.pron}`:''}`
    });
  });
  const gapWords = u.words.map(w=>{
    if(w.skipGap || w.en.includes(' ')) return null;
    const base=w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let m=null;
    try{ m=w.ex.match(new RegExp('\\b'+base+'\\w*\\b','i')); }catch(e){}
    if(!m) return null;
    return {w, form:m[0], sentence:w.ex.replace(m[0],'___')};
  }).filter(Boolean).slice(0,3);
  gapWords.forEach(g=>{
    exs.push({
      t:'gap', id:`${u.id}.g.${g.w.en}`, unit:u.id, skill:'vocab', word:g.w.en, rule:'',
      q:`השלם עם הצורה הנכונה של <b class="en">${g.w.en}</b> (${g.w.he}):`,
      sentence:g.sentence, ans:[g.form],
      why:`המשפט המלא: ${g.w.ex} — ${g.w.exHe} במשפט הזה הצורה היא <b>${g.form}</b>.`,
      hint:`הצורה במשפט מתחילה ב-${g.form[0]}.`
    });
  });
  const l1=u.words[0], l2=u.words[Math.min(6,u.words.length-1)];
  if(l1) exs.push({
    t:'listenmcq', id:`${u.id}.lc.${l1.en}`, unit:u.id, skill:'listening', word:l1.en, rule:'', audio:l1.en,
    q:'לחץ על הכפתור, הקש מה שמעת – ובחר את המשמעות.',
    opts:shuffle([l1.he,...distractors(l1.he,3)]), ans:l1.he,
    why:`שמעת <b class="en">${l1.en}</b> = ${l1.he}. ${l1.ex}`,
    hint:`המילה מתחילה ב-${l1.en[0].toUpperCase()} (${l1.en.length} אותיות).`
  });
  if(l2) exs.push({
    t:'listen', id:`${u.id}.lw.${l2.en}`, unit:u.id, skill:'listening', word:l2.en, rule:'', audio:l2.en,
    q:'לחץ על הכפתור וכתוב את המילה ששמעת.',
    ans:[l2.en], why:`<b class="en">${l2.en}</b> = ${l2.he}. ${l2.ex}`,
    hint:`${l2.en.length} אותיות, מתחילה ב-${l2.en[0].toUpperCase()}.`
  });
  return exs;
}

/* ================= calculations ================= */
function unitDoneCount(u){ return u.exercises.filter(e=>S.prog[e.id]&&S.prog[e.id].done).length; }
function unitCorrectCount(u){ return u.exercises.filter(e=>S.prog[e.id]&&S.prog[e.id].correct>0).length; }
function unitPct(u){ return Math.round(unitDoneCount(u)/u.exercises.length*100); }
function unitComplete(u){ return unitDoneCount(u)===u.exercises.length; }
function nextUnit(){ return UNITS.find(u=>!unitComplete(u)) || UNITS[UNITS.length-1]; }
function dueWords(){ return Object.values(S.words).filter(w=>w.seen && (w.due||0)<=Date.now()).sort((a,b)=>(a.box||0)-(b.box||0)); }
function wordStats(){
  const vals=Object.values(S.words);
  return {
    total:vals.length,
    due:vals.filter(w=>(w.due||0)<=Date.now()).length,
    newW:vals.filter(w=>(w.box||0)===0).length,
    learning:vals.filter(w=>(w.box||0)>0&&(w.box||0)<3).length,
    stable:vals.filter(w=>(w.box||0)>=3&&(w.box||0)<5).length,
    mastered:vals.filter(w=>(w.box||0)>=5).length
  };
}
function ruleStrength(){
  const vals=Object.values(S.rules);
  if(!vals.length) return 0;
  const correct=vals.reduce((a,r)=>a+(r.correct||0),0);
  const all=vals.reduce((a,r)=>a+(r.seen||0),0);
  return all?Math.round(correct/all*100):0;
}
function accuracy(){
  const a=S.stats.answers||0;
  return a?Math.round((S.stats.correct||0)/a*100):0;
}
function overallReadiness(){
  const unitPart = UNITS.reduce((a,u)=>a+unitPct(u),0)/UNITS.length;
  const ws=wordStats();
  const masteredPart = ws.total?ws.mastered/ws.total*100:0;
  const chatPart = Math.min(100,(S.stats.chats||0)*8);
  const examPart = S.exam.best||0;
  return Math.round(unitPart*.5 + masteredPart*.25 + chatPart*.1 + examPart*.15);
}
function masteryDots(en){
  const box=(S.words[en.toLowerCase()]&&S.words[en.toLowerCase()].box)||0;
  return `<span class="mastery" title="רמת שליטה ${box}/5">${[0,1,2,3,4].map(i=>`<i class="${i<box?(box>=4?'on':'mid'):''}"></i>`).join('')}</span>`;
}

function checkBadges(){
  ACHIEVEMENTS.forEach(b=>{
    if(!S.badges[b.id] && b.test(S)){
      S.badges[b.id]=Date.now();
      toast(`${b.icon} הישג חדש: ${b.name}`);
    }
  });
}
function trackAnswer(ex, ok){
  S.stats.answers++; if(ok)S.stats.correct++;
  S.stats.streak = ok ? (S.stats.streak||0)+1 : 0;
  if(S.stats.streak>S.stats.bestStreak) S.stats.bestStreak=S.stats.streak;
  const skill=ex.skill||'vocab';
  S.stats.bySkill[skill]=S.stats.bySkill[skill]||{a:0,c:0};
  S.stats.bySkill[skill].a++; if(ok)S.stats.bySkill[skill].c++;
  S.daily.answers++;
  if(ex.word) recordWord(ex.word,ok);
  if(ex.rule) recordRule(ex.rule,ok);
  markActive();
  checkBadges();
}
function recordWord(en, ok){
  const key=String(en).toLowerCase();
  const w=S.words[key] || (S.words[key]={box:0,due:Date.now(),seen:0,correct:0,wrong:0,last:0});
  w.key=key;
  if(!w.en) w.en=(ALL_WORDS[key]&&ALL_WORDS[key].en)||en;
  if(!w.he) w.he=(ALL_WORDS[key]&&ALL_WORDS[key].he)||'';
  w.seen=(w.seen||0)+1; w.last=Date.now();
  if(ok){
    w.correct=(w.correct||0)+1;
    w.box=Math.min(5,(w.box||0)+1);
    w.due=Date.now()+INTERVALS[w.box]*DAY;
  }else{
    w.wrong=(w.wrong||0)+1;
    w.box=Math.max(0,(w.box||0)-1);
    w.due=Date.now()+15*60000;
  }
}
function recordRule(id, ok){
  if(!id) return;
  const r=S.rules[id] || (S.rules[id]={seen:0,correct:0,wrong:0});
  r.seen++; if(ok)r.correct++; else r.wrong++;
}
function hydrateExtraWords(){
  Object.values(S.words||{}).forEach(w=>{
    if(!w||!w.en) return;
    const key=String(w.en).toLowerCase();
    if(!ALL_WORDS[key]){
      const obj={en:w.en,he:w.he||'',pron:'',ex:'From your conversation: '+w.en+'.',exHe:'מהשיחה שלך.'};
      ALL_WORDS[key]=obj; ALL_WORD_LIST.push(obj);
    }
  });
}

/* ================= exercise engine ================= */
let QS=null;
function currentUnitExercise(u){
  const pos=clamp(S.unitPos[u.id]||0,0,u.exercises.length-1);
  return {ex:u.exercises[pos],index:pos};
}
function practiceHTML(u){
  const {ex,index}=currentUnitExercise(u);
  const done=unitDoneCount(u);
  const allDone=done===u.exercises.length;
  return `<div class="card flat" style="margin-bottom:12px">
      <div class="row"><span class="tag">${u.icon} ${u.he}</span><span class="tag lime">${done}/${u.exercises.length} הושלמו</span>
      <button class="btn xs ghost" style="margin-inline-start:auto" data-act="toggle-map">מפה</button></div>
      <div class="ex-map ${S.seen.mapOpen?'':'hide'}" id="ex-map">${u.exercises.map((e,i)=>{
        const p=S.prog[e.id];
        return `<button data-act="jump" data-idx="${i}" class="${p&&p.done?'done':''} ${i===index?'cur':''} ${p&&p.wrong&&!p.correct?'wrong':''}" title="תרגיל ${i+1}">${i+1}</button>`;
      }).join('')}</div>
    </div>
    ${allDone && !S.seen.retryPractice ? `<div class="card center">
      <div style="font-size:2rem">🏁</div><h2 style="margin:6px 0">סיימת את היחידה!</h2>
      <p class="muted small">${unitCorrectCount(u)} מתוך ${u.exercises.length} נכונים. המילים נכנסו למעגל החזרה – שם הן יהפכו ליציבות.</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" data-go="#/review">🔁 לחזרה החכמה</button><button class="btn ghost" data-act="re-practice">תרגל שוב</button><button class="btn ghost" data-go="#/unit/${u.id}/chat">💬 שיחה</button></div>
    </div>` : `<div id="ex-host"></div>`}
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-go="#/unit/${u.id}/explain">📖 חזרה על הכללים</button><button class="btn sm ghost" data-go="#/unit/${u.id}/words">📚 המילים</button></div>`;
}
function mountUnitPractice(u){
  const host=$('#ex-host'); if(!host) return;
  const idx=clamp(S.unitPos[u.id]||0,0,u.exercises.length-1);
  mountExercise(host,u.exercises[idx],{scope:'unit',unitId:u.id,index:idx,total:u.exercises.length});
}
function mountExercise(host,ex,ctx){
  QS={ex,ctx,attempts:0,hint:0,answered:false,tokens:null,zone:[],typed:'',choice:null,revealed:false};
  if(ex.t==='scr'){
    const words=ex.sentence.split(' ');
    let sh=shuffle(words);
    if(words.length>2){ let tries=0; while(sh.join(' ')===words.join(' ')&&tries++<10) sh=shuffle(words); }
    QS.tokens=sh.map((w,i)=>({w,id:i,used:false}));
  }
  host.innerHTML=exerciseCardHTML();
  const inp=$('#answer-input'); if(inp && innerWidth>760) setTimeout(()=>inp.focus(),80);
}
function exerciseCardHTML(){
  const {ex,ctx}=QS;
  const u=UNITS.find(x=>x.id===ex.unit)||{};
  const badge = ctx.scope==='review'?'🔁 חזרה':ctx.scope==='exam'?'📝 מבחן':ctx.scope==='drill'?'🎯 אימון':`${u.icon||'📘'} יחידה ${u.n||''}`;
  const skillTag = ex.skill==='grammar'?'דקדוק':ex.skill==='listening'?'שמיעה':'אוצר מילים';
  let body='';
  const disabled=QS.answered?'disabled':'';
  if(ex.t==='mcq'||ex.t==='listenmcq'){
    body = `${ex.t==='listenmcq'?`<button class="listen-big" data-act="listen">🔊 השמע שוב</button>`:''}
      <div class="opts">${ex.opts.map((o,i)=>`<button class="opt ${QS.choice===o?(QS.choiceCorrect?'correct':'wrong'):''}" data-opt="${escA(o)}" ${disabled}>
        <span class="k">${'ABCD'[i]||i+1}</span><span class="${/[\u0590-\u05FF]/.test(o)?'':'en'}">${esc(o)}</span></button>`).join('')}</div>`;
  }else if(ex.t==='gap'){
    body=`<div class="ex-sentence">${ex.sentence.split('___').map((part,i,arr)=>esc(part)+(i<arr.length-1?'<span class="blank">______</span>':'')).join('')}</div>
      <input class="txt" id="answer-input" placeholder="הקלד את הצורה החסרה…" value="${escA(QS.typed)}" ${disabled} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }else if(ex.t==='type'||ex.t==='listen'){
    body=`${ex.t==='listen'?`<button class="listen-big" data-act="listen">🔊 השמע</button>`:''}
      <input class="txt" id="answer-input" placeholder="הקלד באנגלית…" value="${escA(QS.typed)}" ${disabled} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }else if(ex.t==='scr'){
    body=`<div class="scr-zone" id="scr-zone">${QS.zone.map(id=>{const t=QS.tokens.find(x=>x.id===id);return `<button class="tok in-zone" data-act="unpick" data-id="${id}">${esc(t.w)}</button>`}).join('')}</div>
      <div class="scr-zone" style="border-style:solid;border-color:var(--line)">${QS.tokens.filter(t=>!QS.zone.includes(t.id)).map(t=>`<button class="tok" data-act="pick" data-id="${t.id}">${esc(t.w)}</button>`).join('')}</div>`;
  }
  const isExam=ctx.scope==='exam';
  const actions = isExam
    ? (ex.t==='mcq'||ex.t==='listenmcq' ? '' : `<button class="btn primary" data-act="check">✔ בדיקה</button>`)
    : (ex.t==='mcq'||ex.t==='listenmcq'
      ? `<button class="btn sm ghost" data-act="hint">💡 רמז</button>${ex.rule?`<button class="btn sm ghost" data-act="rule" data-rule="${ex.rule}">📘 הכלל</button>`:''}`
      : `<button class="btn primary" data-act="check">✔ בדיקה</button>
         <button class="btn sm ghost" data-act="hint">💡 רמז</button>
         ${ex.t==='scr'?`<button class="btn sm ghost" data-act="clear">↩ ניקוי</button>`:''}
         ${ex.rule?`<button class="btn sm ghost" data-act="rule" data-rule="${ex.rule}">📘 הכלל</button>`:''}`);
  return `<div class="ex-shell">
    <div class="ex-top">
      <span class="tag">${badge}</span><span class="tag lime">${skillTag}</span>
      ${ctx.total?`<span class="tiny muted">${ctx.index+1} מתוך ${ctx.total}</span>`:''}
      ${ctx.scope==='unit'?`<button class="btn xs ghost" style="margin-inline-start:auto" data-act="unit-rules">📖 הסבר היחידה</button>`:''}
    </div>
    <div class="ex-progress"><i style="width:${ctx.total?Math.round((ctx.index)/ctx.total*100):0}%"></i></div>
    <div class="ex-card">
      <div class="ex-num">${ctx.scope==='exam'?'שאלת מבחן':ctx.scope==='review'?'כרטיס חזרה':'תרגיל'} ${ctx.index+1}${ctx.total?' / '+ctx.total:''}</div>
      <div class="ex-q">${ex.q}</div>
      ${body}
      <div id="hint-slot"></div>
      <div class="ex-actions">${actions}</div>
      <div id="fb-slot" aria-live="polite"></div>
    </div>
  </div>`;
}
function renderQuestion(){
  const host=$('#ex-host');
  if(host) host.innerHTML=exerciseCardHTML();
  else {
    const shell=$('.ex-shell');
    if(shell) shell.outerHTML=exerciseCardHTML();
  }
  const inp=$('#answer-input');
  if(inp){ inp.addEventListener('input',e=>{QS.typed=e.target.value}); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); checkTyped(); } }); }
}
function currentAccepted(){
  const ex=QS.ex;
  return [].concat(ex.ans||[]);
}
function finalize(ok, given){
  if(QS.answered) return;
  QS.answered=true; QS.correct=ok; QS.given=given;
  const ex=QS.ex, firstTry=QS.attempts===0;
  trackAnswer(ex,ok);
  markProg(ex,ok);
  let gain=0;
  if(ok){
    gain = QS.ctx.scope==='review' ? (firstTry?5:2) : (firstTry?10:5);
    if(QS.hint>0) gain=Math.min(gain,3);
    addXP(gain,$('.ex-card')); beep(true);
  }
  else beep(false);
  if(ex.t==='mcq'||ex.t==='listenmcq'){
    $$('.opt').forEach(b=>{
      b.disabled=true;
      if(normHE(b.dataset.opt)===normHE(ex.ans)) b.classList.add('correct');
      else if(b.dataset.opt===given) b.classList.add('wrong');
      else b.classList.add('dim');
    });
  }
  const inp=$('#answer-input'); if(inp) inp.disabled=true;
  if(ex.skill==='listening' && ok){}
  if(QS.ctx.scope==='review' && typeof reviewAnswered==='function') reviewAnswered(ok);
  if(QS.ctx.scope==='exam' && typeof examAnswered==='function') examAnswered(ok);
  if(QS.ctx.scope==='drill' && typeof drillAnswered==='function') drillAnswered(ok);
  showFeedback(ok,gain);
  save();
}
function markProg(ex,ok){
  if(QS.ctx.scope==='review'||QS.ctx.scope==='exam'||QS.ctx.scope==='drill') return;
  const p=S.prog[ex.id] || (S.prog[ex.id]={done:false,correct:0,wrong:0,seen:0,first:false,ts:0});
  p.done=true; p.seen=(p.seen||0)+1; p.ts=Date.now();
  if(ok){ p.correct=(p.correct||0)+1; if(p.seen===1) p.first=true; }
  else p.wrong=(p.wrong||0)+1;
}
function showFeedback(ok,gain){
  const ex=QS.ex, slot=$('#fb-slot'); if(!slot) return;
  const accepted=currentAccepted();
  const answerLine=accepted.map(a=>`<span class="en">${esc(a)}</span>`).join(' / ');
  const ruleBtn=(ex.rule&&QS.ctx.scope!=='exam')?`<button class="btn xs ghost" data-act="rule" data-rule="${ex.rule}">📘 פתח את הכלל</button>`:'';
  const nextLabel=QS.ctx.scope==='exam'?'לשאלה הבאה ←':'הבא ←';
  if(ok){
    slot.innerHTML=`<div class="fb ok">
      <h4>✅ ${praise()} ${gain?`<span style="color:var(--gold)">+${gain} XP</span>`:''}</h4>
      ${QS.near?`<div class="small" style="color:var(--gold)">כמעט מושלם – שים לב לאיות: <span class="en">${esc(accepted[0])}</span></div>`:''}
      <div class="why">${ex.why||''}</div>
      <div class="divider" style="margin:10px 0"></div>
      <div class="row">${ruleBtn}<button class="btn sm primary" data-act="next">${nextLabel}</button></div>
    </div>`;
  }else{
    slot.innerHTML=`<div class="fb no">
      <h4>💪 ${nope()}</h4>
      <div class="small">התשובה הנכונה:</div>
      <div class="answer-line">${answerLine}</div>
      <div class="why">${ex.why||''}</div>
      <div class="row" style="margin-top:10px">${ruleBtn}<button class="btn sm ghost" data-act="retry">🔄 נסה שוב</button><button class="btn sm primary" data-act="next">${nextLabel}</button></div>
    </div>`;
  }
  slot.scrollIntoView({behavior:'smooth',block:'center'});
}
function checkCurrent(){
  if(!QS||QS.answered) return;
  if(QS.ex.t==='scr'){
    const val=(QS.zone||[]).map(id=>{const t=QS.tokens.find(x=>x.id===id);return t?t.w:''}).join(' ');
    if(!val.trim()){ toast('בחר מילים כדי לבנות משפט 🙂'); return; }
    const res=compareAnswer(val,[QS.ex.sentence]);
    QS.near=res.near;
    if(res.ok) finalize(true,val);
    else { QS.attempts++; QS.typed=val; finalize(false,val); }
    return;
  }
  checkTyped();
}
function checkTyped(){
  if(!QS||QS.answered) return;
  if(QS.ex.t==='scr'){ checkCurrent(); return; }
  const input=$('#answer-input'); const val=input?input.value:'';
  QS.typed=val;
  if(!val.trim()){ toast('כתוב תשובה קודם 🙂'); return; }
  const res=compareAnswer(val,currentAccepted());
  QS.near=res.near;
  if(res.ok) finalize(true,val);
  else { QS.attempts++; finalize(false,val); }
}
function chooseOption(val){
  if(!QS||QS.answered) return;
  const ex=QS.ex;
  const ok = /[\u0590-\u05FF]/.test(ex.ans) ? normHE(val)===normHE(ex.ans) : normEN(val)===normEN(ex.ans);
  QS.choice=val; QS.choiceCorrect=ok;
  if(!ok) QS.attempts++;
  finalize(ok,val);
}
function showHint(){
  if(!QS) return;
  QS.hint++;
  const slot=$('#hint-slot'); if(!slot) return;
  const ex=QS.ex;
  if(ex.t==='mcq'||ex.t==='listenmcq'){
    if(QS.hint===1){
      const wrong=[...$$('.opt')].filter(b=>normHE(b.dataset.opt)!==normHE(ex.ans));
      if(wrong[0]){ wrong[0].classList.add('dim'); wrong[0].disabled=true; }
      slot.innerHTML=`<div class="hintbox">💡 פסלתי תשובה אחת. נשארו ${ex.opts.length-1}. קרא שוב את המשפט ושאל: מי עושה את הפעולה?</div>`;
    }else{
      slot.innerHTML=`<div class="hintbox">💡 ${thinHint(ex.ans,2)}<br><button class="btn xs ghost" style="margin-top:6px" data-act="rule" data-rule="${ex.rule||''}">📘 הכלל יעזור</button></div>`;
    }
  }else if(ex.t==='scr'){
    const first=ex.sentence.split(' ')[0];
    slot.innerHTML=`<div class="hintbox">💡 המשפט מתחיל ב-<b class="en">${esc(first)}</b> ובסך הכול ${ex.sentence.split(' ').length} מילים.</div>`;
  }else if(ex.t==='listen'||ex.t==='listenmcq'){
    slot.innerHTML=`<div class="hintbox">💡 ${thinHint(ex.ans,QS.hint)}<br><button class="btn xs ghost" style="margin-top:6px" data-act="listen">🔊 השמע שוב</button></div>`;
  }else{
    slot.innerHTML=`<div class="hintbox">💡 ${thinHint([].concat(ex.ans)[0],QS.hint)}</div>`;
  }
}
function retryQuestion(){
  if(!QS) return;
  const ex=QS.ex, ctx=QS.ctx, attempts=QS.attempts, hint=QS.hint;
  mountExercise($('#ex-host'),ex,ctx);
  QS.attempts=attempts; QS.hint=hint;
}
function nextInUnit(){
  const u=UNITS.find(x=>x.id===QS.ctx.unitId);
  let idx=QS.ctx.index+1;
  if(idx>=u.exercises.length){
    S.unitPos[u.id]=u.exercises.length-1; save(); render();
    toast('🏁 סיימת את היחידה! עכשיו לחזרה החכמה');
    return;
  }
  S.unitPos[u.id]=idx; save(); render();
}
function jumpExercise(i){
  const u=UNITS.find(x=>x.id===QS.ctx.unitId);
  S.unitPos[u.id]=clamp(Number(i),0,u.exercises.length-1); save(); render();
}
function openRule(ruleId){

/* ================= review / spaced repetition ================= */
function startReview(){
  Object.keys(S.words).forEach(k=>{ if(S.words[k]) S.words[k].key=k; });
  let keys=dueWords().map(w=>w.key);
  if(!keys.length){
    keys=Object.keys(S.words).filter(k=>((S.words[k].box||0)<4)).sort((a,b)=>(S.words[a].box||0)-(S.words[b].box||0)).slice(0,10);
  }
  if(!keys.length){
    toast('עוד אין מילים במעגל – התחל מיחידה 1');
    go('#/learn'); return;
  }
  S.review.queue=keys.slice(0,12);
  S.review.idx=0; S.review.results=[]; S.review.finished=false;
  save(); go('#/review/session');
}
function wordByKey(k){
  if(ALL_WORDS[k]) return ALL_WORDS[k];
  return ALL_WORD_LIST.find(w=>w.en.toLowerCase()===k)||null;
}
function reviewExercise(word){
  const key=word.en.toLowerCase();
  const s=S.words[key]||{box:0};
  const others=shuffle(ALL_WORD_LIST.filter(w=>w.he!==word.he&&w.en!==word.en));
  const box=s.box||0;
  const mode = box>=4 ? 'listen' : box>=3 ? 'gap' : box===2 ? 'type' : 'mcq';
  if(mode==='type'){
    return {t:'type', id:'rev.'+key, unit:'', skill:'vocab', word:key, q:`איך כותבים באנגלית: <b>${esc(word.he)}</b>?`, ans:[word.en],
      why:`<b class="en">${word.en}</b> = ${word.he}. ${word.ex}`, hint:`${word.en.length} אותיות, מתחילה ב-${word.en[0].toUpperCase()}.`};
  }
  if(mode==='gap'){
    const base=word.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let m=null; try{ m=word.ex.match(new RegExp('\\b'+base+'\\w*\\b','i')); }catch(e){}
    if(m){
      return {t:'gap', id:'rev.g.'+key, unit:'', skill:'vocab', word:key, q:`השלם מהזיכרון: <b class="en">${word.en}</b> (${word.he})`,
        sentence:word.ex.replace(m[0],'___'), ans:[m[0]], why:`${word.ex} — ${word.exHe}`, hint:`מתחילה ב-${m[0][0]}.`};
    }
  }
  if(mode==='listen'){
    return {t:'listen', id:'rev.l.'+key, unit:'', skill:'listening', word:key, audio:word.en,
      q:'לחץ 🔊, הקש וכתוב את המילה ששמעת.', ans:[word.en], why:`<b class="en">${word.en}</b> = ${word.he}. ${word.ex}`,
      hint:`${word.en.length} אותיות, מתחילה ב-${word.en[0].toUpperCase()}.`};
  }
  const otherHe=[...new Set(others.map(w=>w.he))].filter(h=>h!==word.he).slice(0,3);
  return {t:'mcq', id:'rev.m.'+key, unit:'', skill:'vocab', word:key,
    q:`מה המשמעות של <b class="en">${word.en}</b>?`,
    opts:shuffle([word.he,...otherHe]), ans:word.he,
    why:`<b class="en">${word.en}</b> = ${word.he}. ${word.ex}`, hint:`המילה מופיעה בדוגמה: ${word.ex}`};
}
function reviewAnswered(ok){
  if(!Array.isArray(S.review.results)) S.review.results=[];
  S.review.results.push(!!ok);
  S.review.doneToday=(S.review.doneToday||0)+1;
  S.daily.reviews=(S.daily.reviews||0)+1;

function similarity(a,b){
  const A=normEN(a).split(' ').filter(Boolean), B=normEN(b).split(' ').filter(Boolean);
  if(!B.length) return 0;
  let hit=0; const used=new Set();
  B.forEach(w=>{ const i=A.findIndex((x,j)=>!used.has(j)&&(x===w||lev(x,w)<=1)); if(i>=0){hit++;used.add(i);} });
  return Math.round(hit/B.length*100);
}

let EXAM=null, EXAM_RESULT=null, examTimer=null;
function startExam(){
  const pool=UNITS.flatMap(u=>u.exercises).filter(e=>['mcq','type','gap','scr'].includes(e.t));
  const list=shuffle(pool).slice(0,20);
  EXAM={list,idx:0,correct:0,answers:[],start:Date.now()};
  S.exam.active={ids:list.map(e=>e.id),idx:0,correct:0,answers:[],start:EXAM.start};
  EXAM_RESULT=null; save(); go('#/exam');
}
function hydrateExam(){
  if(EXAM || !S.exam.active || !S.exam.active.ids) return;
  const list=S.exam.active.ids.map(id=>EX_MAP[id]).filter(Boolean);
  if(!list.length){ S.exam.active=null; return; }
  EXAM={list,idx:S.exam.active.idx||0,correct:S.exam.active.correct||0,answers:S.exam.active.answers||[],start:S.exam.active.start||Date.now()};
}
function examAnswered(ok){
  if(!EXAM) return;
  if(ok) EXAM.correct++;
  EXAM.answers[EXAM.idx]=ok;
  S.exam.active={ids:EXAM.list.map(e=>e.id),idx:EXAM.idx,correct:EXAM.correct,answers:EXAM.answers,start:EXAM.start};
  save();
}
function nextExam(){
  if(!EXAM) return;
  EXAM.idx++;
  if(EXAM.idx>=EXAM.list.length){ finishExam(); return; }
  S.exam.active.idx=EXAM.idx; save(); render();
}
function finishExam(){
  if(!EXAM) return;
  const total=EXAM.list.length, correct=EXAM.correct, score=Math.round(correct/total*100);
  S.exam.last={score,correct,total,date:Date.now()};
  S.exam.best=Math.max(S.exam.best||0,score); S.exam.attempts=(S.exam.attempts||0)+1;
  S.exam.active=null;
  EXAM_RESULT={score,correct,total};
  addXP(Math.max(10,Math.round(score/3)),$('#ex-host'));
  checkBadges(); saveNow(); EXAM=null;
  confetti(score>=70?34:12);
  render();
}
function pageExam(){

    </div>`;
  }
  const ex=EXAM.list[EXAM.idx];
  if(!ex){ finishExam(); return ''; }
  return `<div class="page"><div class="chat-summary">
    <div class="exam-head"><button class="back" data-go="#/learn">→</button><div><h1 class="page-title" style="font-size:1.1rem">📝 מבחן מסכם</h1><div class="tiny muted">${EXAM.idx+1} מתוך ${EXAM.list.length}</div></div>

  upd(); examTimer=setInterval(upd,1000);
}

/* ================= global events ================= */
function handleGlobalClick(e){
  const t=e.target.closest('[data-say]');
  if(t){ speak(t.dataset.say); return; }
  const nav=e.target.closest('[data-nav]');
  if(nav){ closeSideNav(); go('#/'+nav.dataset.nav); return; }
  const g=e.target.closest('[data-go]');
  if(g){ const href=g.dataset.go; if(href.startsWith('http')) window.location.href=href; else go(href); return; }
  const cp=e.target.closest('[data-copy]');
  if(cp){ try{ navigator.clipboard.writeText(cp.dataset.copy); toast('📋 הועתק'); }catch(err){} return; }
  if(e.target.closest('[data-close]')){ closeModal(); return; }
  if(e.target.id==='overlay'){ closeModal(); return; }
  const opt=e.target.closest('[data-opt]');
  if(opt && QS && !QS.answered){ chooseOption(opt.dataset.opt); return; }
  const act=e.target.closest('[data-act]');
  if(!act) return;
  const a=act.dataset.act;
  switch(a){
    case 'check': checkCurrent(); break;
    case 'hint': showHint(); break;
    case 'next':
      if(QS.ctx.scope==='review') nextReview();
      else if(QS.ctx.scope==='drill') nextDrill();
      else if(QS.ctx.scope==='exam') nextExam();
      else nextInUnit();
      break;
    case 'retry': retryQuestion(); break;
    case 'listen': if(QS){ const src=QS.ex.audio||QS.ex.ans[0]; speak(src); } break;
    case 'rule': e.stopPropagation(); openRule(act.dataset.rule); break;
    case 'unit-rules': { const u=UNITS.find(x=>x.id===QS.ctx.unitId); if(u) openUnitRules(u); break; }
    case 'pick': if(QS){ QS.zone.push(Number(act.dataset.id)); renderQuestion(); } break;
    case 'unpick': if(QS){ QS.zone=QS.zone.filter(x=>x!==Number(act.dataset.id)); renderQuestion(); } break;
    case 'clear': if(QS){ QS.zone=[]; renderQuestion(); } break;
    case 'jump': if(QS&&QS.ctx.unitId) jumpExercise(act.dataset.idx); break;
    case 'toggle-map': S.seen.mapOpen=!S.seen.mapOpen; render(); break;
    case 're-practice': S.seen.retryPractice=true; S.unitPos[UNITS.find(x=>x.id===QS?.ctx.unitId)?.id||'u1']=0; render(); break;
    case 'start-review': startReview(); break;
    case 'end-review': S.review.finished=true; S.review.queue=[]; save(); go('#/review'); break;
    case 'start-drill': startDrill(act.dataset.kind); break;
    case 'speak-start': startSpeak(); break;
    case 'speak-mic': speakMic(); break;
    case 'speak-next': nextSpeak(); break;
    case 'speak-self': { SPEAK.results.push(80); SPEAK.last={heard:'(אישור עצמי)',score:80}; S.stats.speak++; S.stats.speakScore+=80; addXP(4); nextSpeak(); break; }
    case 'start-exam': startExam(); break;
    case 'abort-exam': if(confirm('לצאת מהמבחן? ההתקדמות במבחן לא תישמר.')){ EXAM=null; S.exam.active=null; save(); EXAM_RESULT=null; go('#/learn'); } break;
    case 'toggle-nav': toggleSideNav(); break;
    case 'close-nav': closeSideNav(); break;
    case 'settings': closeSideNav(); openSettings(); break;
    case 'toggle-sound': S.settings.sound=!S.settings.sound; saveNow(); updateHeader(); toast(S.settings.sound?'🔊 צליל פעיל':'🔇 צליל כבוי'); break;
    case 'save-settings': readSettings(); break;
    case 'test-api': if(typeof testApiConnection==='function') testApiConnection(); break;
    case 'guide': openGuide(); break;
    case 'export': exportBackup(); break;
    case 'import-file': importFilePicker(); break;
    case 'backup-link': backupLink(); break;
    case 'reset-all': openReset(); break;
    case 'confirm-reset': doReset(); break;
    case 'confirm-import': if(PENDING_IMPORT) applyImport(PENDING_IMPORT); break;
    case 'chat-report': openChatReport(); break;
    default: if(typeof handleChatAction==='function') handleChatAction(a,act);
  }
}

  const text=inp.value.trim(); if(!text) return;
  sendText(text);
  inp.value=''; inp.style.height='auto';
}
function sendText(text){
  if(!text||CHAT_BUSY) return;
  const wasFirst=!(S.chat.messages||[]).some(m=>m.role==='me');
  S.chat.messages.push({role:'me',text,ts:Date.now()});
  if(wasFirst){ S.stats.chats=(S.stats.chats||0)+1; S.chat.sessions=(S.chat.sessions||0)+1; }
  S.chat.reported=false;
  S.daily.chats=(S.daily.chats||0)+1;
  S.daily.chatXp=S.daily.chatXp||0;
  if(S.daily.chatXp<10){ addXP(2,$('#chat-shell')); S.daily.chatXp+=2; }
  markActive(); saveNow();
  CHAT_BUSY=true;
  renderChatMessages();
  const typing=document.createElement('div');
  if(canUseAI()){
    aiTurn(text).then(res=>{
      CHAT_BUSY=false;
      appendAI(res);
      if(S.settings.autoSpeak) speak(res.reply);
    }).catch(err=>{
      CHAT_BUSY=false;
      appendAI({reply:'I had a connection problem. Let’s keep going! You can try again, or we can continue with the local coach.',he:'הייתה בעיית חיבור. אפשר לנסות שוב, או להמשיך במאמן המקומי.',corrections:[],suggestions:[],words:[],error:apiErrorHe(err)});
    });
  }else{
    setTimeout(()=>{
      CHAT_BUSY=false;
      const res=localCoachReply(text);
      appendAI(res);
      if(S.settings.autoSpeak) speak(res.reply);
    },650);
  }
}
function appendAI(res){
  const sc=scenarioById(S.chat.scenario);
  const words=(res.words||[]).slice(0,2);
  words.forEach(w=>{ if(w&&w.en) S.chat.learned[w.en]=w.he||''; });
  S.chat.messages.push({
    role:'ai', text:res.reply||'…', he:res.translation||res.he||'',
    corrections:res.corrections||[], suggestions:res.suggestions||[], words,
    praise:res.praise||'', error:res.error||'', ts:Date.now()
  });
  if(S.chat.messages.length>80) S.chat.messages=S.chat.messages.slice(-80);
  saveNow(); renderChatMessages();
}
function apiErrorHe(err){
  const c=err&&err.apiCode;
  if(err&&err.name==='AbortError') return 'הבקשה לקחה יותר מדי זמן. נסה שוב.';
  if(c===401||c===403) return 'המפתח לא תקין או שאין הרשאה. בדוק את המפתח בהגדרות.';
  if(c===429) return 'חרגת ממכסת הבקשות. המתן רגע ונסה שוב.';
  if(c===400) return 'הבקשה לא התקבלה – ייתכן ששם המודל שגוי.';
  if(c===0) return 'הדפדפן חסם את החיבור (CORS) או שאין אינטרנט. ZAI ישיר כמעט תמיד נחסם מדפדפן – עבור למצב Proxy עם Worker.';
  if(c===404) return 'כתובת ה-API לא נמצאה. בדוק את ה-Endpoint.';
  return 'שגיאת חיבור ('+(c||'?')+'). אפשר להמשיך במצב המקומי.';
}
async function aiTurn(userText){
  const sc=scenarioById(S.chat.scenario)||SCENARIOS[SCENARIOS.length-1];
  const sys=buildSystemPrompt(sc);
  const msgs=[{role:'system',content:sys}];
  (S.chat.messages||[]).slice(-14).forEach(m=>{
    if(m.role==='me') msgs.push({role:'user',content:m.text});
    else msgs.push({role:'assistant',content:m.text});
  });
  const raw=await callZAI(msgs,{maxTokens:800});
  if(!raw||!raw.trim()) throw new Error('empty');
  return parseAI(raw);
}
function buildSystemPrompt(sc){
  const level=S.settings.level||'B1';
  const style={gentle:'Only correct serious mistakes (max 1). Be very gentle.',balanced:'Correct up to 2 clear mistakes. Be encouraging.',strict:'Correct up to 3 mistakes, including small ones.'}[S.settings.correction]||'Correct up to 2 clear mistakes. Be encouraging.';
  const target=sc.words.map(w=>w.en).join(', ');
  return `You are ${sc.who}, a ${sc.role}, inside a personal English-learning app for BEERI, a 15-year-old Israeli footballer who loves football, sports psychology, animals, nature and popular science.

YOUR ROLE: Be a warm, funny, encouraging English conversation coach and stay in character. The scenario: ${sc.title} / ${sc.desc}
Target vocabulary you may weave in naturally: ${target}.
CEFR level: ${level}. Use short sentences and simple, natural English. Reply with 2–4 sentences, then exactly ONE question.
Correction style: ${style}

If BEERI writes in Hebrew: understand it, reply in very simple English, and gently give him the English sentence he could use. Do not shame him.
If he writes very little (one or two words), encourage a full sentence and give a model.
Praise effort specifically (e.g. "Nice past tense!").
Never ask for private information, never discuss anything inappropriate for a teenager. Keep it school-safe.
Use only well-known, accurate facts; if you are not sure, say "I'm not sure" instead of inventing.

Return ONLY valid JSON, with no markdown fences, exactly in this shape:
{"reply":"English reply, 2-4 sentences, ends with one question","translation":"תרגום טבעי של reply לעברית","corrections":[{"wrong":"the learner's exact error","right":"the corrected English","why":"הסבר קצר בעברית, עד 15 מילים"}],"suggestions":["short English reply BEERI could say","...","..."],"words":[{"en":"useful word from your reply","he":"תרגום"}],"praise":"משפט עידוד קצר בעברית"}

Rules for fields:
- "corrections": max 2, only real errors in BEERI's latest message. If none, use [].
- "suggestions": exactly 3 possible replies for BEERI, 5–10 words each, at his level, directly answering your question.
- "words": max 2 useful new words/phrases from your reply, with accurate Hebrew.
- "translation" and "why" must be Hebrew. "reply" and "suggestions" must be English.
- Do not put Hebrew inside "reply". Do not add any text outside the JSON object.`;
}
function parseAI(raw){
  let t=String(raw).trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  let obj=null;
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>=0&&b>a){
    try{ obj=JSON.parse(t.slice(a,b+1)); }catch(e){
      try{ obj=JSON.parse(t.slice(a,b+1).replace(/,\s*}/g,'}').replace(/,\s*]/g,']')); }catch(e2){}
    }
  }
  if(!obj){
    const m=t.match(/"reply"\s*:\s*"((?:\\.|[^"\\])*)"/);
    if(m){
      try{
        const reply=JSON.parse('"'+m[1]+'"');
        const taxi=t.match(/"translation"\s*:\s*"((?:\\.|[^"\\])*)"/);
        const translation=taxi?JSON.parse('"'+taxi[1]+'"'):'';
        return {reply,translation,corrections:[],suggestions:[],words:[],praise:''};
      }catch(e){}
    }
    return {reply:t.replace(/^["']|["']$/g,'').slice(0,1200)||'Let’s keep going! What do you think?',translation:'',corrections:[],suggestions:[],words:[],praise:''};
  }
  const cleanArr=x=>Array.isArray(x)?x.filter(Boolean):[];
  const corrections=cleanArr(obj.corrections).map(c=>{
    if(typeof c==='string') return {wrong:'',right:c,why:''};
    return {wrong:String(c.wrong||c.original||''),right:String(c.right||c.correct||c.corrected||''),why:String(c.why||c.explanation||'')};
  }).filter(c=>c.right).slice(0,3);
  const suggestions=cleanArr(obj.suggestions).map(s=>typeof s==='string'?s:String(s.text||s.reply||'')).filter(Boolean).slice(0,3);
  const words=cleanArr(obj.words).map(w=>typeof w==='string'?{en:w,he:''}:{en:String(w.en||w.word||''),he:String(w.he||w.meaning||'')}).filter(w=>w.en).slice(0,2);
  return {
    reply:String(obj.reply||obj.message||'').trim()||'Let’s keep going! What do you think?',
    translation:String(obj.translation||obj.hebrew||''),
    corrections,suggestions,words,praise:String(obj.praise||'')
  };
}

/* ================= ZAI transport ================= */
async function callZAI(messages,opts={}){
  const a=S.api;
  const url=(a.mode==='proxy'?a.proxy:a.endpoint)||'';
  if(!url) throw Object.assign(new Error('no url'),{apiCode:404});
  const headers={'Content-Type':'application/json','Accept':'application/json'};
  if(a.mode==='direct'){
    if(!a.key) throw Object.assign(new Error('no key'),{apiCode:401});
    headers.Authorization='Bearer '+a.key;
  }
  const body={model:a.model||'openai/gpt-oss-120b',messages,temperature:.72,max_tokens:opts.maxTokens||800};
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),opts.timeout||45000);
  let res;
  try{
    res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ctrl.signal});
  }catch(err){
    clearTimeout(timer);
    if(err.name==='AbortError') throw err;
    throw Object.assign(new Error('network'),{apiCode:0});
  }
  clearTimeout(timer);
  const raw=await res.text();
  if(!res.ok){
    let msg=raw;
    try{ const j=JSON.parse(raw); msg=(j.error&&(j.error.message||j.error.code))||j.message||raw; }catch(e){}
    throw Object.assign(new Error(msg||'http '+res.status),{apiCode:res.status});
  }
  let data;
  try{ data=JSON.parse(raw); }catch(e){ throw Object.assign(new Error('bad json'),{apiCode:502}); }
  const ch=data.choices&&data.choices[0];
  let content=ch&&ch.message&&ch.message.content;
  if(Array.isArray(content)) content=content.map(p=>p.text||p.content||'').join('');
  if(!content && data.data && data.data.choices) content=data.data.choices[0]?.message?.content;
  if(typeof content!=='string'||!content.trim()) throw Object.assign(new Error('empty'),{apiCode:502});
  return content;
}
